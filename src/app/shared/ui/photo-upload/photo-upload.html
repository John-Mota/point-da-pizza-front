<div
  class="pdp-photo-upload"
  [class.pdp-photo-upload--dragging]="isDragging()"
  [class.pdp-photo-upload--error]="!!errorMessage()"
  [class.pdp-photo-upload--disabled]="isDisabled()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    #fileInput
    [id]="inputId()"
    type="file"
    class="pdp-photo-upload__input"
    accept="image/jpeg,image/png,image/webp"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="!!errorMessage()"
    [attr.aria-describedby]="errorMessage() ? inputId() + '-err ' + inputId() + '-hint' : inputId() + '-hint'"
    (change)="onFileSelected($event)"
    tabindex="-1"
  />

  <div class="pdp-photo-upload__content">
    <div class="pdp-photo-upload__avatar" aria-hidden="true">
      @if (previewUrl()) {
        <img [src]="previewUrl()" alt="Prévia da foto de perfil" class="pdp-photo-upload__img" />
      } @else if (initials()) {
        <span class="pdp-photo-upload__initials">{{ initials() }}</span>
      } @else {
        <i class="pi pi-user pdp-photo-upload__icon" aria-hidden="true"></i>
      }
    </div>

    <div class="pdp-photo-upload__actions">
      <div class="pdp-photo-upload__buttons">
        <button
          pButton
          pRipple
          type="button"
          class="pdp-photo-upload__btn pdp-photo-upload__btn--choose p-button-outlined p-button-sm"
          [disabled]="isDisabled()"
          (click)="triggerFileInput()"
        >
          <i class="pi pi-camera" aria-hidden="true"></i>
          <span>Escolher foto</span>
        </button>

        @if (value()) {
          <button
            pButton
            pRipple
            type="button"
            class="pdp-photo-upload__btn pdp-photo-upload__btn--remove p-button-text p-button-danger p-button-sm"
            [disabled]="isDisabled()"
            (click)="removePhoto()"
          >
            <i class="pi pi-trash" aria-hidden="true"></i>
            <span>Remover foto</span>
          </button>
        }
      </div>

      <span [id]="inputId() + '-hint'" class="pdp-photo-upload__hint">
        JPG, PNG ou WebP até 2 MB (ou arraste aqui)
      </span>
    </div>
  </div>
</div>

@if (errorMessage()) {
  <span [id]="inputId() + '-err'" class="pdp-photo-upload__err" role="alert">
    {{ errorMessage() }}
  </span>
}
