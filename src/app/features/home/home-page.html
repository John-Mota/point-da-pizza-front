<div class="pdp-home">
  @if (carregando()) {
    <div class="pdp-skeleton pdp-home__skeleton-header"></div>
    <main class="pdp-home__container">
      <section
        class="pdp-home__loading"
        aria-busy="true"
        aria-label="Carregando cardápio"
      >
        <div class="pdp-skeleton pdp-home__skeleton-nav"></div>
        <div class="pdp-skeleton pdp-home__skeleton-promos"></div>
        <div class="pdp-skeleton pdp-home__skeleton-products"></div>
        <div class="pdp-skeleton pdp-home__skeleton-footer"></div>
      </section>
    </main>
  } @else if (erro()) {
    <main class="pdp-home__container pdp-home__container--spaced">
      <pdp-card class="pdp-home__error-card">
        <div class="pdp-home__error" role="alert">
          <p class="pdp-home__error-msg">{{ erro() }}</p>
          <button
            pButton
            pRipple
            type="button"
            class="pdp-home__retry-btn"
            (click)="carregarCardapio()"
          >
            Tentar de novo
          </button>
        </div>
      </pdp-card>
    </main>
  } @else {
    <pdp-loja-header [loja]="loja()"></pdp-loja-header>
    <main class="pdp-home__container">
      <div class="pdp-home__areas">
        <pdp-categorias-nav
          [categorias]="categorias()"
          [(ativaId)]="categoriaAtivaId"
          (selecionar)="aoSelecionarCategoria($event)"
        ></pdp-categorias-nav>
        <pdp-destaques-section
          [destaques]="destaques()"
          (pedir)="aoPedirDestaque($event)"
        ></pdp-destaques-section>
        <pdp-produtos [categorias]="categorias()" [produtos]="produtos()"></pdp-produtos>
        <pdp-rodape [loja]="loja()"></pdp-rodape>
      </div>
    </main>
  }
</div>
